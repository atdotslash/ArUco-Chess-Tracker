[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aruco-chess-tracker"
version = "0.1.0"
description = "Computer vision desktop application to track a physical chessboard with ArUco markers, validate moves, and interface with robotic arms"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "atdotslash" }
]
dependencies = [
    "opencv-contrib-python>=4.7.0",
    "customtkinter>=5.2.0",
    "chess>=1.9.0",
    "numpy>=1.24.0",
    "pillow>=9.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pyinstaller>=5.10.0",
]

[project.scripts]
aruco-chess-tracker = "main:main"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
